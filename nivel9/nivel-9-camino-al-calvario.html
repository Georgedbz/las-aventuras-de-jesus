        if (locked || !activeAtom(id)) return;
        if (selectedId !== id) {
          selectedId = id;
          previewRemoval = reactionFor(id);
          const affectedWords = [...previewRemoval].map(atomId => atomById(atomId).word).join(", ");
          info.textContent = `La reacción alcanzará: ${affectedWords}. Toca ${atomById(id).word} nuevamente para confirmar.`;
          drawNetwork();
          return;
        }
        executeReaction();

      function executeReaction() {
        const affected = [...previewRemoval].map(id => atomById(id));
        const essential = affected.find(atom => atom.type === "good");
        if (essential) {
          selectedId = null;
          previewRemoval = new Set();
          changeResistance(-10, `${essential.word} sería dañada: -10%`);
          info.textContent = "Esa reacción alcanza una virtud esencial. Busca otro nodo.";
          drawNetwork();
          return;
        }

        locked = true;
        stage.querySelectorAll(".mol-atom.reaction-preview").forEach(element => element.classList.add("removing"));
        transitionTimer = window.setTimeout(() => {
          affected.forEach(atom => { atom.destroyed = true; });
          selectedId = null;
          previewRemoval = new Set();
          locked = false;
          drawNetwork();
          checkComplete();
        }, 340);
      }

      function checkComplete() {
        const corruptedRemain = atoms.some(atom => atom.type === "bad" && !atom.destroyed);
        if (corruptedRemain) {
          const count = atoms.filter(atom => atom.type === "bad" && !atom.destroyed).length;
          info.textContent = `Quedan ${count} elementos de corrupción. Elige la siguiente reacción.`;
          return;
        }

        locked = true;
        flash.textContent = puzzleIndex === puzzles.length - 1
          ? "La red ha sido purificada. Permanecen la fe, el amor y la luz."
          : "Red purificada. Las virtudes esenciales permanecen.";

        previewRemoval = new Set();
        locked = false;
        prompt.textContent = `Red ${index + 1} de ${puzzles.length}: ${puzzle.title}`;
        info.textContent = "Toca un nodo para ver la reacción. Tócalo nuevamente para confirmarla.";
        drawNetwork();
      }

      loadPuzzle(0);
      state.activeCleanup = () => window.clearTimeout(transitionTimer);

    function playFinalPrecision() {
      const badWords = { O: "Odio", M: "Mentira", B: "Burla", P: "Pecado", T: "Traición", V: "Violencia", R: "Rencor", S: "Soberbia", D: "Duda", I: "Injusticia" };
      const goodWords = { A: "Amor", F: "Fe", E: "Esperanza", L: "Luz", G: "Gracia", C: "Compasión", Pz: "Paz", Vd: "Verdad", Dp: "Dominio propio" };
      const neutralWords = { X: "Carga", H: "Humanidad", Q: "Quebranto" };
      const puzzles = [
        {
          title: "La burla del camino",
          atoms: [
            { id: "a", label: "A", type: "good", x: 30, y: 34 },
            { id: "b", label: "B", type: "bad", x: 50, y: 28 },
            { id: "o", label: "O", type: "bad", x: 62, y: 52 },
            { id: "f", label: "F", type: "good", x: 38, y: 62 }
          ],
          bonds: [
            { a: "a", b: "b", type: "normal" },
            { a: "b", b: "o", type: "normal" },
            { a: "o", b: "f", type: "normal" }
          ]
        },
        {
          title: "La mentira y la duda",
          atoms: [
            { id: "vd", label: "Vd", type: "good", x: 28, y: 45 },
            { id: "m", label: "M", type: "bad", x: 48, y: 34 },
            { id: "d", label: "D", type: "bad", x: 60, y: 58 },
            { id: "e", label: "E", type: "good", x: 76, y: 38 },
            { id: "x", label: "X", type: "neutral", x: 40, y: 70 }
          ],
          bonds: [
            { a: "vd", b: "m", type: "dark" },
            { a: "m", b: "d", type: "normal" },
            { a: "d", b: "e", type: "dark" },
            { a: "x", b: "d", type: "normal" }
          ]
        },
        {
          title: "El peso del pecado",
          atoms: [
            { id: "g", label: "G", type: "good", x: 24, y: 28 },
            { id: "p", label: "P", type: "bad", x: 45, y: 28 },
            { id: "h", label: "H", type: "neutral", x: 55, y: 52 },
            { id: "r", label: "R", type: "bad", x: 36, y: 70 },
            { id: "c", label: "C", type: "good", x: 72, y: 70 },
            { id: "q", label: "Q", type: "neutral", x: 76, y: 36 }
          ],
          bonds: [
            { a: "g", b: "p", type: "dark" },
            { a: "p", b: "h", type: "normal" },
            { a: "h", b: "r", type: "normal" },
            { a: "h", b: "c", type: "light" },
            { a: "q", b: "c", type: "normal" },
            { a: "p", b: "q", type: "normal" }
          ]
        },
        {
          title: "La maldad del mundo",
          atoms: [
            { id: "l", label: "L", type: "good", x: 18, y: 36 },
            { id: "v", label: "V", type: "bad", x: 34, y: 24 },
            { id: "t", label: "T", type: "bad", x: 52, y: 34 },
            { id: "pz", label: "Pz", type: "good", x: 72, y: 24 },
            { id: "i", label: "I", type: "bad", x: 80, y: 54 },
            { id: "dp", label: "Dp", type: "good", x: 62, y: 76 },
            { id: "s", label: "S", type: "bad", x: 40, y: 68 },
            { id: "h", label: "H", type: "neutral", x: 24, y: 62 },
            { id: "x", label: "X", type: "neutral", x: 54, y: 56 }
          ],
          bonds: [
            { a: "l", b: "v", type: "dark" },
            { a: "v", b: "t", type: "normal" },
            { a: "t", b: "pz", type: "dark" },
            { a: "pz", b: "i", type: "light" },
            { a: "i", b: "dp", type: "dark" },
            { a: "dp", b: "s", type: "light" },
            { a: "s", b: "h", type: "normal" },
            { a: "h", b: "l", type: "normal" },
            { a: "t", b: "x", type: "normal" },
            { a: "x", b: "s", type: "dark" },
            { a: "x", b: "i", type: "normal" }
          ]
        }
      ];
      let puzzleIndex = 0;
      let atoms = [];
      let bonds = [];

      setMini(`
        <div class="prompt" id="molPrompt">Puzle 1 de 4</div>
        <div class="molecule-wrap">
          <div class="molecule-stage" id="moleculeStage">
            <svg class="molecule-svg" id="moleculeSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
            <div class="molecule-flash" id="moleculeFlash"></div>
          </div>
          <aside class="molecule-legend">
            <h3>Leyenda espiritual</h3>
            <div class="legend-group"><strong>Malos</strong> O Odio, M Mentira, B Burla, P Pecado, T Traición, V Violencia, R Rencor, S Soberbia, D Duda, I Injusticia.</div>
            <div class="legend-group"><strong>Buenos</strong> A Amor, F Fe, E Esperanza, L Luz, G Gracia, C Compasión, Pz Paz, Vd Verdad, Dp Dominio propio.</div>
            <div class="legend-group"><strong>Neutrales</strong> X Carga, H Humanidad, Q Quebranto.</div>
            <div class="legend-group"><strong>Enlaces</strong> Gris normal, morado oscuro se puede cortar, dorado/celeste de luz no se debe cortar.</div>
          </aside>
        </div>
        <div class="round-info" id="molInfo">Toca átomos malos. Corta primero enlaces oscuros peligrosos.</div>
      `);
      const stage = document.getElementById("moleculeStage");
      const svg = document.getElementById("moleculeSvg");
      const prompt = document.getElementById("molPrompt");
      const info = document.getElementById("molInfo");
      const flash = document.getElementById("moleculeFlash");

      function atomById(id) {
        return atoms.find(atom => atom.id === id);
      }

      function wordFor(atom) {
        if (atom.type === "bad") return badWords[atom.label] || atom.label;
        if (atom.type === "good") return goodWords[atom.label] || atom.label;
        return neutralWords[atom.label] || atom.label;
      }

      function loadPuzzle(index) {
        const puzzle = puzzles[index];
        atoms = puzzle.atoms.map(atom => ({ ...atom, destroyed: false }));
        bonds = puzzle.bonds.map((bond, i) => ({ ...bond, id: "bond-" + i, cut: false }));
        prompt.textContent = "Puzle " + (index + 1) + " de 4: " + puzzle.title;
        info.textContent = "Destruye la maldad sin dañar amor, fe, luz ni gracia.";
        drawMolecule();
      }

      function drawMolecule() {
        svg.innerHTML = "";
        stage.querySelectorAll(".mol-atom").forEach(el => el.remove());
        bonds.forEach((bond) => {
          const a = atomById(bond.a);
          const b = atomById(bond.b);
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", a.x);
          line.setAttribute("y1", a.y);
          line.setAttribute("x2", b.x);
          line.setAttribute("y2", b.y);
          line.classList.add("mol-bond", bond.type);
          if (bond.cut || a.destroyed || b.destroyed) line.classList.add("cut");
          line.addEventListener("click", () => cutBond(bond.id));
          svg.appendChild(line);
        });
        atoms.forEach((atom) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "mol-atom " + atom.type + (atom.destroyed ? " destroyed" : "");
          btn.style.left = atom.x + "%";
          btn.style.top = atom.y + "%";
          btn.textContent = atom.label;
          btn.title = wordFor(atom);
          btn.addEventListener("click", () => hitAtom(atom.id));
          stage.appendChild(btn);
        });
      }

      function damageMolecule(amount, message) {
        state.resistance = Math.max(0, state.resistance - amount);
        updateResistance();
        showToast(message);
        if (state.resistance <= 0) {
          flash.textContent = "Jesús necesita recuperar fuerzas. Se reinicia este puzle.";
          flash.classList.add("show");
          setTimeout(() => {
            flash.classList.remove("show");
            state.resistance = 40;
            updateResistance();
            loadPuzzle(puzzleIndex);
          }, 1100);
          return false;
        }
        return true;
      }

      function cutBond(id) {
        const bond = bonds.find(item => item.id === id);
        if (!bond || bond.cut) return;
        if (bond.type === "light") {
          damageMolecule(10, "No cortes un enlace de luz: -10%");
          return;
        }
        if (bond.type !== "dark") {
          showToast("Ese enlace no necesita cortarse");
          return;
        }
        bond.cut = true;
        showToast("Enlace oscuro cortado");
        drawMolecule();
      }

      function hasDangerousGoodBond(atomId) {
        return bonds.some((bond) => {
          if (bond.cut || bond.type !== "dark") return false;
          if (bond.a !== atomId && bond.b !== atomId) return false;
          const other = atomById(bond.a === atomId ? bond.b : bond.a);
          return other && !other.destroyed && other.type === "good";
        });
      }

      function hitAtom(id) {
        const atom = atomById(id);
        if (!atom || atom.destroyed) return;
        if (atom.type === "good") {
          damageMolecule(10, "Átomo bueno dañado: -10%");
          return;
        }
        if (atom.type === "bad" && hasDangerousGoodBond(atom.id)) {
          damageMolecule(10, "Primero corta el enlace oscuro: -10%");
          return;
        }
        atom.destroyed = true;
        showToast(atom.type === "bad" ? "Maldad purificada" : "Carga separada");
        drawMolecule();
        checkMoleculeComplete();
      }

      function checkMoleculeComplete() {
        const remainingBad = atoms.some(atom => atom.type === "bad" && !atom.destroyed);
        if (remainingBad) return;
        puzzleIndex += 1;
        if (puzzleIndex >= puzzles.length) {
          flash.textContent = "Cristo cargó con la maldad del mundo, pero la luz, el amor y la gracia permanecen.";
          flash.classList.add("show");
          setTimeout(() => {
            flash.classList.remove("show");
            completeMoment(5);
          }, 2600);
          return;
        }
        flash.textContent = "Puzle completado. La luz permanece.";
        flash.classList.add("show");
        setTimeout(() => {
          flash.classList.remove("show");
          loadPuzzle(puzzleIndex);
        }, 1100);
      }

      loadPuzzle(0);
      state.activeCleanup = () => {};
    }

    startBtn.addEventListener("click", startMoment);
    mapBtn.addEventListener("click", backToMap);
    bottomMapBtn.addEventListener("click", backToMap);
    restartMomentBtn.addEventListener("click", () => {
      modal.classList.remove("show");
      cleanup();
      if (state.current === 6 && !changeResistance(-2, "Reiniciar el puzle: -2%")) return;
      startMoment();
    });
    bottomActionBtn.addEventListener("click", () => {
      const action = miniInner.querySelector(".action");
      if (action) action.click();
      else window.dispatchEvent(new KeyboardEvent("keydown", { code: "Space", key: " " }));
    });
    modalBtn.addEventListener("click", retryCurrent);

    buildMap();
    updateResistance();
  </script>
</body>
</html>
