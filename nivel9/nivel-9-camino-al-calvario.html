<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nivel 9 - Camino al Calvario</title>
  <style>
    :root {
      --gold: #ffd76a;
      --deep: #2b1a10;
      --wood: #6b3518;
      --paper: #ffe7b1;
      --green: #6ee338;
      --red: #d94b3f;
      --blue: #246aa5;
      --stone: #5f5b55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: #2a170d;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: #2b1b12;
    }

    @media (orientation: landscape) and (max-height: 619px) {
      body {
        overflow-x: hidden;
        overflow-y: auto;
      }
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 620px;
      background:
        linear-gradient(180deg, rgba(52, 32, 18, .04), rgba(31, 19, 12, .22)),
        url("assets/camino-nivel-9.png") center / 100% 100% no-repeat;
      isolation: isolate;
    }

    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(36, 21, 12, .28), transparent 35%, rgba(36, 21, 12, .1));
      pointer-events: none;
      z-index: 0;
    }

    .hud-mask {
      position: absolute;
      left: 10px;
      top: 4px;
      width: 340px;
      height: 154px;
      border-radius: 10px;
      background: linear-gradient(#6e3618, #4a230e);
      box-shadow: 0 10px 0 rgba(0, 0, 0, .16);
      pointer-events: none;
      z-index: 7;
    }

    .hud {
      position: absolute;
      left: 16px;
      top: 6px;
      width: 324px;
      min-width: 0;
      min-height: 132px;
      padding: 13px 14px 12px;
      border: 4px solid #2a160b;
      border-radius: 8px;
      background: linear-gradient(#85451f, #54280f);
      box-shadow: 0 8px 0 rgba(0, 0, 0, .28), inset 0 2px rgba(255,255,255,.18);
      z-index: 8;
    }

    .hud-title {
      color: #fff6d3;
      font-size: clamp(20px, 1.8vw, 27px);
      font-weight: 900;
      text-shadow: 0 3px #2c1508;
      margin-bottom: 5px;
    }

    .res-row {
      display: grid;
      grid-template-columns: 46px 1fr;
      gap: 10px;
      align-items: center;
    }

    .heart {
      width: 46px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      color: #e92931;
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 4px 0 #3b0c0d);
    }

    .bar {
      position: relative;
      height: 42px;
      border: 4px solid #241107;
      border-radius: 13px;
      background: #2d1b10;
      overflow: hidden;
      box-shadow: inset 0 4px 8px rgba(0,0,0,.45);
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(#b9ff4f 0%, #71df20 48%, #42ad15 100%);
      transition: width .35s ease, background .35s ease;
    }

    .bar-text {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-size: clamp(20px, 2vw, 30px);
      font-weight: 900;
      text-shadow: 0 3px 0 #151515, 2px 0 0 #151515, -2px 0 0 #151515;
    }

    .title-plaque {
      position: absolute;
      display: none;
      top: clamp(10px, 3vh, 28px);
      left: 50%;
      transform: translateX(-50%);
      min-width: min(660px, 52vw);
      text-align: center;
      padding: 14px 34px 18px;
      border: 5px solid #3a1d0d;
      border-radius: 8px;
      color: #321704;
      background: linear-gradient(#ffe9ba, #e0a84f);
      box-shadow: 0 8px 0 rgba(0,0,0,.28), inset 0 0 0 3px rgba(255,255,255,.28);
      z-index: 3;
    }

    .level-tag {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      min-width: 180px;
      padding: 4px 18px 8px;
      border: 4px solid #12375b;
      border-radius: 10px;
      color: white;
      background: linear-gradient(#4f8ed1, #1f578c);
      font-size: 28px;
      font-weight: 900;
      text-shadow: 0 3px #0e2b45;
    }

    .title-plaque h1 {
      margin: 14px 0 0;
      font-size: clamp(34px, 4vw, 58px);
      letter-spacing: 0;
      line-height: 1;
    }

    .map-node {
      position: absolute;
      width: clamp(58px, 5.5vw, 82px);
      height: clamp(58px, 5.5vw, 82px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: transparent;
      font-weight: 900;
      font-size: clamp(24px, 3vw, 42px);
      text-shadow: none;
      border: 4px solid transparent;
      background: transparent;
      box-shadow: none;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .map-node.current {
      border-color: var(--gold);
      background: rgba(255, 229, 118, .12);
      box-shadow: 0 0 22px 12px rgba(255, 214, 93, .52), inset 0 0 12px rgba(255,255,255,.35);
    }

    .map-node.done {
      border-color: rgba(144, 241, 120, .9);
      background: rgba(96, 204, 79, .16);
      box-shadow: 0 0 18px rgba(224,255,178,.75), inset 0 0 12px rgba(255,255,255,.25);
    }

    .map-node.locked { opacity: .2; }

    .jesus-token {
      position: absolute;
      width: clamp(64px, 6.4vw, 90px);
      height: clamp(64px, 6.4vw, 90px);
      padding: 4px;
      border: 4px solid var(--gold);
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 50%;
      background: linear-gradient(#fff1c3, #d99b48);
      transform: translate(-50%, -86%);
      transition: left .8s ease, top .8s ease;
      z-index: 5;
      box-shadow: 0 0 18px rgba(255, 221, 113, .75), 0 7px 5px rgba(0,0,0,.35);
      pointer-events: none;
    }

    .start-panel {
      position: absolute;
      left: 24px;
      top: 43%;
      bottom: auto;
      transform: none;
      width: min(390px, calc(100vw - 48px));
      padding: 12px 16px;
      border: 5px solid #8f4a19;
      border-radius: 8px;
      color: #391c09;
      text-align: center;
      background: linear-gradient(#fff0c9, #f1bd69);
      box-shadow: 0 7px 0 rgba(0,0,0,.25);
      z-index: 6;
    }

    .start-panel p {
      margin: 0 0 12px;
      font-size: clamp(16px, 1.55vw, 21px);
      font-weight: 800;
      line-height: 1.15;
    }

    .primary-btn, .secondary-btn {
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 900;
      color: white;
      background: linear-gradient(#3c9adc, #1f5f99);
      box-shadow: 0 5px 0 #12375b;
      text-shadow: 0 2px #12375b;
    }

    .secondary-btn {
      background: linear-gradient(#8b6a49, #5d3b20);
      box-shadow: 0 5px 0 #2e1a0d;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 10;
      padding: clamp(12px, 2vw, 26px);
      background:
        radial-gradient(circle at 70% 15%, rgba(255, 219, 125, .28), transparent 30%),
        linear-gradient(180deg, rgba(65, 41, 25, .92), rgba(30, 18, 12, .96));
    }

    .screen.active {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .challenge-header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      color: #fff6dc;
      text-shadow: 0 2px #1b0d06;
    }

    .challenge-header h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.05;
    }

    .challenge-header p {
      margin: 6px 0 0;
      max-width: 940px;
      font-size: clamp(16px, 1.9vw, 22px);
      color: #ffe7b7;
    }

    .screen.moment-seven {
      padding-top: 10px;
      gap: 8px;
    }

    .screen.moment-seven .challenge-header h2 {
      font-size: clamp(22px, 3vw, 36px);
      line-height: 1;
    }

    .screen.moment-seven .challenge-header p {
      display: none;
    }

    .game-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      align-items: center;
    }

    .game-controls button {
      min-height: 48px;
    }

    .mini {
      position: relative;
      overflow: hidden;
      border: 5px solid #2a160b;
      border-radius: 8px;
      background:
        linear-gradient(rgba(255, 232, 178, .92), rgba(231, 177, 100, .94)),
        url("assets/camino-nivel-9.png") center / cover no-repeat;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.18), 0 9px 0 rgba(0,0,0,.25);
    }

    .mini-inner {
      position: absolute;
      inset: 18px;
      display: grid;
      place-items: center;
      gap: 16px;
      text-align: center;
    }

    .mini-inner.godot-mode {
      inset: 0;
      display: block;
      overflow: hidden;
      background: #17120e;
    }

    .godot-tramo2-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #17120e;
    }

    .godot-loading-shell {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff1c8;
      background: radial-gradient(circle at 50% 42%, #3a2a55 0, #17120e 68%);
      text-align: center;
      transition: opacity .35s ease, visibility .35s ease;
    }

    .godot-loading-shell.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .godot-loading-card {
      width: min(90%, 520px);
      padding: 22px;
      border: 3px solid #f0bd4d;
      border-radius: 18px;
      background: rgba(24, 15, 29, .88);
      box-shadow: 0 14px 38px rgba(0, 0, 0, .42);
    }

    .godot-loading-card strong { display: block; margin-bottom: 8px; font-size: clamp(20px, 3vw, 30px); }
    .godot-loading-card p { margin: 6px 0 14px; font-size: clamp(14px, 2vw, 18px); }
    .godot-loading-card progress { width: 100%; height: 18px; accent-color: #4fc3f7; }

    .mobile-landscape-hint {
      display: none;
    }

    .prompt {
      align-self: start;
      justify-self: center;
      padding: 9px 16px;
      border: 3px solid #633215;
      border-radius: 8px;
      color: #3d1b08;
      background: rgba(255, 238, 195, .92);
      font-size: clamp(16px, 2vw, 23px);
      font-weight: 900;
      box-shadow: 0 4px 0 rgba(0,0,0,.2);
    }

    .round-info {
      color: white;
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 900;
      text-shadow: 0 3px #2b1608;
    }

    .precision-level-indicator {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 58px;
      padding: 5px 16px;
      color: #fff4c9;
      border: 3px solid #4b270f;
      border-radius: 999px;
      background: linear-gradient(#8a4b24, #5b2d13);
      box-shadow: 0 5px 0 rgba(39, 20, 8, .42);
      font-weight: 900;
      text-shadow: 0 2px #2b1608;
    }

    .precision-level-indicator strong {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      color: #274d68;
      border: 3px solid #f1bd51;
      border-radius: 50%;
      background: #fff3bf;
      font-size: 30px;
      line-height: 1;
      text-shadow: none;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.65);
    }

    .precision-level-indicator small {
      color: #ffd66c;
      font-size: 15px;
    }

    .precision-track {
      position: relative;
      width: min(760px, 86vw);
      height: 72px;
      border: 5px solid #2f170a;
      border-radius: 8px;
      background: linear-gradient(90deg, #be4e3d, #f0ca5b 35%, #74d64f 45%, #74d64f 55%, #f0ca5b 65%, #be4e3d);
      box-shadow: inset 0 5px rgba(255,255,255,.22), 0 7px 0 rgba(0,0,0,.28);
    }

    .precision-track.advanced {
      background: linear-gradient(90deg,
        #bf4d3d 0 12%, #78db55 12% 18%, #bf4d3d 18% 36%,
        #78db55 36% 42%, #bf4d3d 42% 58%, #78db55 58% 64%,
        #bf4d3d 64% 82%, #78db55 82% 88%, #bf4d3d 88% 100%);
    }

    .marker {
      position: absolute;
      top: -16px;
      left: 50%;
      width: 14px;
      height: 94px;
      border-radius: 7px;
      background: white;
      border: 3px solid #1a1009;
      box-shadow: 0 0 15px rgba(255,255,255,.85);
      transform: translateX(-50%);
    }

    .precision-wrap {
      position: relative;
      display: grid;
      gap: 18px;
      justify-items: center;
      padding-top: 72px;
    }

    .precision-jesus {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(82px, 9vw, 126px);
      border-radius: 0;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 7px 4px rgba(0,0,0,.35)) contrast(1.08) saturate(1.05);
      background: transparent;
    }

    .balance-stage {
      width: min(760px, 88vw);
      height: min(410px, 52vh);
      display: grid;
      place-items: center;
      border-bottom: 12px solid rgba(72, 43, 20, .45);
    }

    .safe-zone {
      position: absolute;
      width: 220px;
      height: 220px;
      border-left: 5px dashed rgba(60, 146, 60, .8);
      border-right: 5px dashed rgba(60, 146, 60, .8);
      pointer-events: none;
    }

    .cross-balance {
      width: 290px;
      height: 210px;
      position: relative;
      transform-origin: 50% 62%;
      transition: transform .08s linear;
    }

    .cross-balance::before,
    .cross-balance::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      border: 4px solid #351706;
      border-radius: 8px;
      background: linear-gradient(90deg, #7d3c15, #b86727, #6c310f);
      box-shadow: inset 0 4px rgba(255,255,255,.12), 0 6px 0 rgba(0,0,0,.22);
    }

    .cross-balance::before {
      width: 72px;
      height: 250px;
      transform: translate(-50%, -50%) rotate(-18deg);
    }

    .cross-balance::after {
      width: 280px;
      height: 58px;
      transform: translate(-50%, -62%) rotate(-18deg);
    }

    .pulse-wrap {
      display: grid;
      place-items: center;
      gap: 16px;
    }

    .pulse-circle {
      width: min(230px, 42vw);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 8px solid #2d1609;
      background: radial-gradient(circle, #fff7ca 0 27%, #7ed9ff 28% 42%, #225d8e 43% 100%);
      box-shadow: 0 0 35px rgba(255,245,184,.65), inset 0 0 0 8px rgba(255,255,255,.25);
      transform: scale(.78);
      transition: transform .12s linear, filter .12s linear;
    }

    .pulse-circle.ready {
      transform: scale(1.05);
      filter: brightness(1.22);
    }

    .rollance-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,238,165,.55), transparent 23%),
        linear-gradient(#bcecff, #f7cf85 43%, #5f3d24 44%, #2f1d12);
      perspective: 760px;
    }

    .rollance-path {
      position: absolute;
      left: 50%;
      bottom: -18%;
      width: min(560px, 72vw);
      height: 118%;
      transform: translateX(-50%) rotateX(62deg);
      transform-origin: bottom center;
      background:
        linear-gradient(90deg, transparent 0 31%, rgba(255,255,255,.18) 31% 32%, transparent 32% 68%, rgba(255,255,255,.18) 68% 69%, transparent 69%),
        repeating-linear-gradient(180deg, #b78a58 0 64px, #9d7145 64px 128px);
      border-left: 8px solid #503015;
      border-right: 8px solid #503015;
      box-shadow: 0 16px 0 rgba(0,0,0,.18);
    }

    .rollance-edge {
      position: absolute;
      left: 50%;
      bottom: -18%;
      width: min(560px, 72vw);
      height: 118%;
      transform: translateX(-50%) rotateX(62deg);
      transform-origin: bottom center;
      pointer-events: none;
      z-index: 1;
    }

    .rollance-edge::before,
    .rollance-edge::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      border-radius: 8px;
      background: linear-gradient(#70461f, #2d1a0d);
      box-shadow: 0 0 10px rgba(0,0,0,.28);
    }

    .rollance-edge::before { left: 6%; }
    .rollance-edge::after { right: 6%; }

    .rollance-goal {
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      padding: 8px 20px;
      border: 4px solid #2a160b;
      border-radius: 8px;
      color: #2a160b;
      background: linear-gradient(#fff7c8, #ffd76a);
      font-weight: 900;
      z-index: 3;
      box-shadow: 0 5px 0 rgba(0,0,0,.25);
    }

    .rollance-ball {
      position: absolute;
      left: 50%;
      bottom: 16%;
      width: clamp(82px, 9vw, 122px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 5px solid #fff0a8;
      object-fit: cover;
      background: #f5e4c1;
      box-shadow: 0 0 18px rgba(255,230,118,.7), 0 9px 6px rgba(0,0,0,.35);
      transition: transform .1s linear;
      z-index: 2;
    }

    .rollance-hazard, .rollance-gem {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 0);
      z-index: 1;
    }

    .rollance-hazard {
      width: clamp(62px, 7vw, 92px);
      height: clamp(42px, 5vw, 66px);
      border: 4px solid #2d180c;
      border-radius: 48% 42% 45% 38%;
      background: radial-gradient(circle at 35% 25%, #9f988c, #5d574f 70%);
      box-shadow: 0 7px 0 rgba(0,0,0,.26);
    }

    .rollance-gem {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6a8, #70dbff 38%, #2b77d0);
      border: 3px solid #fff8c8;
      box-shadow: 0 0 16px #dffcff;
    }

    .loop-game {
      width: min(780px, 92vw);
      height: min(500px, 62vh);
      position: relative;
      border: 5px solid #2a160b;
      border-radius: 8px;
      background: radial-gradient(circle at 50% 20%, #37537d, #12283b 48%, #0a1722);
      overflow: hidden;
      box-shadow: inset 0 0 45px rgba(255,255,255,.12);
    }

    .loop-path {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .loop-line {
      stroke: rgba(255,255,255,.45);
      stroke-width: 8;
      stroke-linecap: round;
      fill: none;
    }

    .loop-line.on {
      stroke: #8eeaff;
      filter: drop-shadow(0 0 8px #8eeaff);
    }

    .loop-node {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 4px solid #dff7ff;
      background: #203e5e;
      color: white;
      font-weight: 900;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px rgba(142,234,255,.55);
      z-index: 2;
    }

    .loop-node.active {
      background: #0ca7d6;
      box-shadow: 0 0 24px #9ff4ff;
    }

    .loop-node.goal {
      background: #c93644;
      border-color: #ffe2e2;
      font-size: 24px;
    }

    .energy-board {
      width: min(560px, 86vw);
      aspect-ratio: 1;
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 5px solid #2a160b;
      border-radius: 8px;
      background: radial-gradient(circle at 50% 35%, #294e73, #10233a 70%);
      box-shadow: inset 0 0 42px rgba(142,234,255,.18), 0 8px 0 rgba(0,0,0,.25);
    }

    .energy-tile {
      position: relative;
      border: 3px solid rgba(213,244,255,.75);
      border-radius: 12px;
      background: rgba(11,30,48,.88);
      color: white;
      display: grid;
      place-items: center;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 900;
      box-shadow: inset 0 0 16px rgba(255,255,255,.1);
      overflow: hidden;
    }

    .energy-tile::before,
    .energy-tile::after {
      content: "";
      position: absolute;
      background: rgba(230, 250, 255, .5);
      transition: background .18s ease, box-shadow .18s ease;
    }

    .energy-tile::before {
      width: 18%;
      height: 100%;
      left: 41%;
      top: 0;
      transform: rotate(var(--rot, 0deg));
    }

    .energy-tile::after {
      width: 100%;
      height: 18%;
      left: 0;
      top: 41%;
      transform: rotate(var(--rot, 0deg));
      display: var(--elbow, none);
    }

    .energy-tile.powered {
      border-color: #8eeaff;
      box-shadow: 0 0 18px rgba(142,234,255,.75), inset 0 0 18px rgba(142,234,255,.22);
    }

    .energy-tile.powered::before,
    .energy-tile.powered::after {
      background: #8eeaff;
      box-shadow: 0 0 12px #8eeaff;
    }

    .energy-tile.heart.powered {
      background: radial-gradient(circle, #ffe0e8, #e13f58);
      color: white;
      box-shadow: 0 0 28px rgba(255,118,148,.85);
    }

    .runner {
      position: absolute;
      inset: 0;
      background: linear-gradient(#ffd07e, #f7b15e 42%, #9b6634 43%, #70431f);
      overflow: hidden;
    }

    .runner-road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34%;
      background: linear-gradient(#a97944, #68401f);
      border-top: 6px solid #543217;
    }

    .runner-jesus {
      position: absolute;
      left: 10%;
      bottom: 24%;
      width: clamp(84px, 10vw, 138px);
      transition: transform .12s ease;
      filter: drop-shadow(0 7px 4px rgba(0,0,0,.35));
      z-index: 2;
      will-change: bottom;
    }

    .runner-jesus.crouch {
      transform: scaleY(.72);
      transform-origin: bottom;
    }

    .obstacle {
      position: absolute;
      right: -80px;
      bottom: 34%;
      width: 72px;
      height: 54px;
      border: 4px solid #2c170a;
      border-radius: 8px;
      background: #6d6254;
      color: white;
      display: grid;
      place-items: center;
      font-weight: 900;
      z-index: 1;
    }

    .obstacle.high {
      bottom: 46%;
      width: 122px;
      height: 38px;
      background: #7d3d16;
    }

    .obstacle.rock {
      border-radius: 48% 42% 45% 38%;
      background: radial-gradient(circle at 35% 25%, #9f988c, #5d574f 70%);
    }

    .obstacle.wood {
      width: 118px;
      height: 42px;
      background: linear-gradient(90deg, #6f3514, #a95d22, #6b3212);
    }

    .obstacle.torch {
      width: 44px;
      height: 108px;
      bottom: 34%;
      background: linear-gradient(#ffcf4e 0 30%, #9b3b18 31% 44%, #5b2e12 45%);
      border-radius: 18px 18px 8px 8px;
    }

    .sync-bars, .lanes {
      width: min(760px, 88vw);
      display: grid;
      gap: 22px;
    }

    .sync-track {
      position: relative;
      height: 62px;
      border: 4px solid #2b1609;
      border-radius: 8px;
      background: linear-gradient(90deg, #b95542, #e2c75b 38%, #7bde56 45% 55%, #e2c75b 62%, #b95542);
      box-shadow: inset 0 4px rgba(255,255,255,.2);
    }

    .sync-label {
      position: absolute;
      left: 10px;
      top: -34px;
      color: white;
      font-weight: 900;
      font-size: 22px;
      text-shadow: 0 2px #1f1008;
    }

    .sync-dot {
      position: absolute;
      top: 50%;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 4px solid #201008;
      background: #fff4bd;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 16px rgba(255,255,255,.8);
    }

    .puzzle-wrap {
      width: min(800px, 90vw);
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(260px, 1fr);
      gap: 14px;
      align-items: center;
    }

    .mini-inner:has(.puzzle-wrap) {
      inset: 14px 18px 24px;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }

    .puzzle-board {
      --puzzle-cols: 2;
      --puzzle-rows: 2;
      width: clamp(250px, min(38vw, calc(100vh - 380px)), 410px);
      max-height: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(var(--puzzle-cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--puzzle-rows), minmax(0, 1fr));
      gap: 2px;
      padding: 5px;
      border: 3px solid #2a160b;
      border-radius: 8px;
      background: rgba(255,238,195,.94);
      box-shadow: 0 8px 0 rgba(0,0,0,.25);
    }

    .puzzle-tile {
      position: relative;
      border: 1px solid rgba(107, 53, 24, .72);
      border-radius: 4px;
      background-repeat: no-repeat;
      min-height: 0;
      touch-action: none;
      cursor: grab;
      transition: opacity .15s ease, outline-color .15s ease, box-shadow .15s ease;
    }

    .puzzle-tile.dragging {
      opacity: .34;
      cursor: grabbing;
    }

    .puzzle-tile.drag-target {
      outline: 3px solid #ffd76a;
      outline-offset: -3px;
      box-shadow: inset 0 0 18px rgba(255, 215, 106, .85);
    }

    .puzzle-tile.correct {
      box-shadow: inset 0 0 0 2px rgba(76, 158, 72, .72);
    }

    .puzzle-drag-ghost {
      position: fixed;
      z-index: 9999;
      margin: 0;
      pointer-events: none;
      opacity: .92;
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 12px 24px rgba(28, 15, 7, .42);
      cursor: grabbing;
    }

    .puzzle-side {
      display: grid;
      gap: 8px;
      justify-items: center;
      color: #fff5d6;
      text-align: center;
      font-size: clamp(18px, 2vw, 25px);
      font-weight: 900;
      text-shadow: 0 3px #2b1608;
    }

    .puzzle-preview {
      max-width: min(270px, 32vw);
      max-height: min(250px, calc(100vh - 500px));
      border: 5px solid #2a160b;
      border-radius: 8px;
      background: #fff0c8;
      object-fit: contain;
      box-shadow: 0 8px 0 rgba(0,0,0,.25);
    }

    .molecule-wrap {
      width: min(1060px, 94vw);
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(240px, 320px);
      gap: 16px;
      align-items: stretch;
    }

    .molecule-stage {
      position: relative;
      min-height: min(560px, 64vh);
      border: 5px solid #2a160b;
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(118, 197, 255, .22), transparent 38%),
        linear-gradient(180deg, #18243b, #2a1830 54%, #130e18);
      box-shadow: inset 0 0 50px rgba(255,255,255,.12), 0 8px 0 rgba(0,0,0,.25);
    }

    .molecule-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .mol-bond {
      stroke-width: 7;
      stroke-linecap: round;
      cursor: pointer;
      opacity: .95;
    }

    .mol-bond.normal { stroke: #a9adb5; }
    .mol-bond.dark { stroke: #9c2245; filter: drop-shadow(0 0 5px #c03561); }
    .mol-bond.light { stroke: #ffd76a; filter: drop-shadow(0 0 8px #fff0a8); }
    .mol-bond.cut {
      opacity: .18;
      stroke-dasharray: 8 10;
      pointer-events: none;
    }

    .mol-bond.reaction-preview {
      stroke: #ff9d42;
      stroke-dasharray: 9 7;
      filter: drop-shadow(0 0 7px #ffba61);
      animation: reactionBondPulse .72s ease-in-out infinite alternate;
    }

    .mol-atom {
      position: absolute;
      width: clamp(58px, 6.2vw, 78px);
      height: clamp(58px, 6.2vw, 78px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 5px solid rgba(255,255,255,.72);
      color: white;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 900;
      text-shadow: 0 3px 0 rgba(0,0,0,.45);
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 7px 0 rgba(0,0,0,.28), inset 0 5px rgba(255,255,255,.16);
    }

    .mol-atom.good {
      color: #2b1707;
      background: radial-gradient(circle at 35% 25%, #fff9d6, #ffd76a 55%, #7edcff);
      box-shadow: 0 0 24px rgba(255,235,136,.85), 0 7px 0 rgba(0,0,0,.28);
    }

    .mol-atom.bad {
      background: radial-gradient(circle at 35% 25%, #7f3147, #4a1327 62%, #1a0b16);
    }

    .mol-atom.neutral {
      background: radial-gradient(circle at 35% 25%, #b69c78, #6e5940 68%, #322519);
    }

    .molecule-stage.dense-network .mol-atom {
      width: clamp(42px, 5vw, 62px);
      height: clamp(42px, 5vw, 62px);
      border-width: 4px;
      font-size: clamp(14px, 1.8vw, 23px);
    }

    .mol-atom.destroyed {
      opacity: .15;
      transform: translate(-50%, -50%) scale(.76);
      pointer-events: none;
    }

    .mol-atom.reaction-preview {
      outline: 5px solid #ffb24e;
      outline-offset: 3px;
      animation: reactionNodePulse .72s ease-in-out infinite alternate;
    }

    .mol-atom.reaction-origin {
      outline-color: #fff3a2;
      box-shadow: 0 0 18px #fff, 0 0 34px #ffb43c;
    }

    .mol-atom.removing {
      animation: reactionRemove .34s ease-in forwards;
      pointer-events: none;
    }

    .molecule-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @keyframes reactionNodePulse {
      to { filter: brightness(1.25); transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes reactionBondPulse {
      to { opacity: .48; }
    }

    @keyframes reactionRemove {
      to { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(18deg); }
    }

    .molecule-flash {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: #fff7c7;
      font-size: clamp(24px, 3.5vw, 42px);
      font-weight: 900;
      text-shadow: 0 3px 0 #2b1608;
      background: radial-gradient(circle, rgba(255,235,126,.42), rgba(255,255,255,.12) 32%, rgba(20,13,18,.72));
      z-index: 5;
    }

    .molecule-flash.show { display: grid; }

    .molecule-legend {
      display: grid;
      gap: 10px;
      align-content: start;
      padding: 14px;
      border: 5px solid #2a160b;
      border-radius: 8px;
      color: #fff5d6;
      background: linear-gradient(#5a321b, #2d190e);
      box-shadow: 0 8px 0 rgba(0,0,0,.25);
    }

    .molecule-legend h3 {
      margin: 0;
      color: #fff0b6;
      font-size: clamp(20px, 2vw, 26px);
    }

    .legend-group {
      display: grid;
      gap: 5px;
      font-size: clamp(13px, 1.35vw, 16px);
      line-height: 1.2;
    }

    .legend-group strong { color: #ffd76a; }

    .lanes {
      grid-template-columns: repeat(4, 1fr);
      height: min(500px, 62vh);
      align-self: end;
      gap: 8px;
    }

    .lane {
      position: relative;
      overflow: hidden;
      border: 4px solid #2b1609;
      border-radius: 8px;
      background: rgba(64, 35, 18, .48);
    }

    .lane-key {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 16px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 4px solid #ffe7a8;
      border-radius: 8px;
      color: #fff7ca;
      font-size: 34px;
      font-weight: 900;
      background: rgba(24, 13, 8, .48);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    }

    .word {
      position: absolute;
      left: 7px;
      right: 7px;
      top: -56px;
      min-height: 44px;
      display: grid;
      place-items: center;
      border: 3px solid #2b1609;
      border-radius: 8px;
      font-size: clamp(13px, 1.5vw, 20px);
      font-weight: 900;
      color: #271307;
      background: #fff0b6;
      box-shadow: 0 4px 0 rgba(0,0,0,.25);
    }

    .word.bad {
      color: white;
      background: #8c4545;
    }

    .word.good-hit {
      z-index: 5;
      animation: goodWordFlash .42s ease-out forwards;
    }

    .word.bad-hit {
      z-index: 5;
      animation: badWordFade .38s ease-out forwards;
    }

    .lane-key.bad-press {
      animation: badKeyFlash .48s ease-out;
    }

    .words-intro {
      width: min(680px, 90vw);
      display: grid;
      justify-items: center;
      gap: 16px;
      padding: clamp(20px, 4vw, 36px);
      border: 5px solid #542a12;
      border-radius: 20px;
      color: #3c210e;
      background: linear-gradient(#fff4cc, #efc774);
      box-shadow: 0 10px 0 rgba(44, 23, 8, .34), inset 0 0 0 3px rgba(255,255,255,.46);
      text-align: center;
    }

    .words-intro h2 {
      margin: 0;
      color: #245c72;
      font-size: clamp(28px, 4vw, 42px);
    }

    .words-intro p {
      margin: 0;
      max-width: 590px;
      font-size: clamp(16px, 2vw, 22px);
      font-weight: 800;
      line-height: 1.35;
    }

    .word-examples,
    .arrow-guide {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .word-example {
      padding: 7px 12px;
      border: 2px solid #573018;
      border-radius: 999px;
      background: #fff2b6;
      font-weight: 900;
    }

    .word-example.bad { color: white; background: #934343; }

    .arrow-guide span {
      display: grid;
      place-items: center;
      width: 48px;
      height: 42px;
      border: 3px solid #ffe5a0;
      border-radius: 8px;
      color: #fff7ca;
      background: #533019;
      font-size: 25px;
      font-weight: 900;
    }

    @keyframes goodWordFlash {
      0% { transform: scale(1); background: #fff0b6; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
      45% { transform: scale(1.16); color: #174f33; background: #fffbd0; box-shadow: 0 0 12px #fff, 0 0 30px #ffe15c, 0 0 48px #8ff0a6; }
      100% { transform: scale(.84); opacity: 0; box-shadow: 0 0 25px #ffe15c; }
    }

    @keyframes badWordFade {
      45% { transform: scale(1.08); background: #c92f37; box-shadow: 0 0 24px #ff3e46; }
      100% { transform: scale(.86); opacity: 0; }
    }

    @keyframes badKeyFlash {
      0%, 100% { transform: scale(1); background: rgba(24, 13, 8, .48); }
      35% { transform: scale(1.08); color: white; background: #c82431; box-shadow: 0 0 20px #ff3642, inset 0 0 12px #ff9c9c; }
    }

    .result-toast {
      position: absolute;
      left: 50%;
      top: 74px;
      transform: translateX(-50%);
      min-width: min(560px, 86vw);
      padding: 10px 16px;
      border: 4px solid #2b1609;
      border-radius: 8px;
      color: #2b1609;
      background: #fff2bd;
      font-size: clamp(18px, 2.3vw, 28px);
      font-weight: 900;
      text-align: center;
      opacity: 0;
      z-index: 20;
      transition: opacity .16s ease;
      pointer-events: none;
    }

    .result-toast.show { opacity: 1; }

    .modal {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(30, 17, 10, .72);
      z-index: 30;
    }

    .modal.show { display: grid; }

    .modal-card {
      width: min(650px, 94vw);
      padding: 24px;
      border: 5px solid #2b1609;
      border-radius: 8px;
      text-align: center;
      background: linear-gradient(#fff3cd, #e7b46a);
      box-shadow: 0 10px 0 rgba(0,0,0,.32);
    }

    .modal-card h3 {
      margin: 0 0 10px;
      font-size: clamp(26px, 3vw, 40px);
    }

    .modal-card p {
      margin: 0 0 18px;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      line-height: 1.25;
    }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .game { min-height: 760px; }
      .title-plaque {
        min-width: calc(100vw - 24px);
        padding-inline: 16px;
      }
      .hud {
        top: 8px;
        width: min(300px, calc(100vw - 28px));
        min-width: 0;
      }
      .hud-mask {
        left: 8px;
        top: 4px;
        width: min(316px, calc(100vw - 16px));
        height: 154px;
      }
      .map-node {
        width: 42px;
        height: 42px;
      }
      .jesus-token { width: 74px; }
      .start-panel {
        left: 12px;
        top: 42%;
        bottom: auto;
        width: min(330px, calc(100vw - 24px));
      }
      .challenge-header {
        grid-template-columns: 1fr;
      }
      .challenge-header .secondary-btn {
        justify-self: start;
      }
      .mini-inner { inset: 10px; }
      .lanes { height: 500px; }
      .word { font-size: 12px; }
      .game-controls {
        grid-template-columns: 1fr;
      }
      .puzzle-wrap {
        width: 100%;
        grid-template-columns: minmax(0, 1fr) minmax(110px, .72fr);
        gap: 8px;
      }
      .puzzle-board {
        width: min(100%, 260px);
      }
      .puzzle-preview {
        max-width: 100%;
        max-height: 160px;
      }
      .puzzle-side {
        gap: 5px;
        font-size: 14px;
      }
      .mini-inner:has(.puzzle-wrap) {
        inset: 8px 10px 18px;
        gap: 6px;
      }
      .molecule-wrap {
        grid-template-columns: 1fr;
      }
      .molecule-stage {
        min-height: 430px;
      }
      .molecule-legend {
        max-height: 210px;
        overflow: auto;
      }
    }

    @media (max-width: 760px) and (orientation: portrait) {
      .mini-inner.godot-mode .mobile-landscape-hint {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #fff4cc;
        background: rgba(18, 18, 36, .94);
        font-size: clamp(19px, 5.5vw, 25px);
        font-weight: 900;
        line-height: 1.3;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <div class="shade"></div>
    <div class="hud-mask" aria-hidden="true"></div>

    <section class="title-plaque" aria-label="Titulo del nivel">
      <div class="level-tag">Nivel 9</div>
      <h1>Camino al Calvario</h1>
    </section>

    <aside class="hud" aria-label="Resistencia">
      <div class="hud-title">Resistencia</div>
      <div class="res-row">
        <div class="heart" aria-hidden="true">♥</div>
        <div class="bar">
          <div class="bar-fill" id="resFill"></div>
          <div class="bar-text" id="resText">100%</div>
        </div>
      </div>
    </aside>

    <img class="jesus-token" id="jesusToken" src="assets/jesus-cruz.png" alt="Jesús cargando la cruz">

    <section class="start-panel" id="startPanel">
      <p id="mapMessage">Cada paso de resistencia nos acerca al plan de Dios.</p>
      <button class="primary-btn" id="startBtn" type="button">Comenzar momento</button>
    </section>

    <section class="screen" id="challengeScreen" aria-live="polite">
      <header class="challenge-header">
        <div>
          <h2 id="challengeTitle">Momento de resistencia</h2>
          <p id="challengeText"></p>
        </div>
        <button class="secondary-btn" id="mapBtn" type="button">Volver al mapa</button>
      </header>
      <div class="mini" id="miniArea">
        <div class="mini-inner" id="miniInner"></div>
        <div class="result-toast" id="toast"></div>
      </div>
      <footer class="game-controls">
        <button class="secondary-btn" id="bottomMapBtn" type="button">Mapa</button>
        <button class="secondary-btn" id="restartMomentBtn" type="button">Reiniciar momento</button>
        <button class="primary-btn" id="bottomActionBtn" type="button">Acción</button>
      </footer>
    </section>

    <section class="modal" id="modal">
      <div class="modal-card">
        <h3 id="modalTitle">Recuperar fuerzas</h3>
        <p id="modalText">Jesús necesita recuperar fuerzas. Intenta nuevamente este momento de resistencia.</p>
        <button class="primary-btn" id="modalBtn" type="button">Intentar nuevamente</button>
      </div>
    </section>
  </main>

  <script>
    const nodes = [
      { x: 11, y: 86, title: "Primer agotamiento" },
      { x: 25, y: 75, title: "Camino irregular" },
      { x: 43, y: 76, title: "Respirar y continuar" },
      { x: 52, y: 64, title: "Obstáculos en el camino" },
      { x: 60, y: 52, title: "Ayuda de Simón de Cirene" },
      { x: 73, y: 41, title: "Perdón ante la burla" },
      { x: 73, y: 30, title: "Última subida al Gólgota" },
      { x: 73, y: 19, title: "Llegada al Gólgota" }
    ];

    const moments = [
      {
        title: "Momento de resistencia 1: Primer agotamiento",
        text: "Presiona Espacio, Flecha Abajo o el botón de acción cuando el marcador esté en la franja verde, que cambia de posición en cada nivel."
      },
      {
        title: "Momento de resistencia 2: Camino irregular",
        text: "Guía la esfera con Izquierda y Derecha hasta la meta, evitando huecos y conservando el equilibrio."
      },
      {
        title: "Momento de resistencia 3: Energía de esperanza",
        text: "Gira los senderos y lleva la energía desde la fuente hasta todas las lámparas en siete niveles."
      },
      {
        title: "Momento de resistencia 4: Obstáculos en el camino",
        text: "Salta con Arriba o Espacio los obstáculos bajos. Agáchate con Abajo ante ramas o maderos."
      },
      {
        title: "Momento de resistencia 5: Ayuda de Simón de Cirene",
        text: "Completa seis rompecabezas para representar la ayuda recibida en el camino."
      },
      {
        title: "Momento de resistencia 6: Perdón ante la burla",
        text: "Toma palabras buenas con la flecha correcta y evita las palabras negativas."
      },
      {
        title: "Momento de resistencia 7: Última subida al Gólgota",
        text: ""
      }
    ];

    const LEVEL9_SAVE_KEY = "aventurasJesus.nivel9.v1";
    const INTERNAL_ORIGIN = window.location.origin;
    let savedLevel9 = null;
    try { savedLevel9 = JSON.parse(localStorage.getItem(LEVEL9_SAVE_KEY) || "null"); } catch {}
    const requestedMoment = Number(new URLSearchParams(location.search).get("qaMoment"));
    const state = {
      resistance: Math.max(0, Math.min(100, Number(savedLevel9?.resistance) || 100)),
      current: Math.max(0, Math.min(7, Number.isFinite(requestedMoment) && requestedMoment > 0 ? requestedMoment : Number(savedLevel9?.current) || 0)),
      completed: new Set(Array.isArray(savedLevel9?.completed) ? savedLevel9.completed : []),
      activeCleanup: null,
      locked: false
    };

    function saveLevel9Progress() {
      localStorage.setItem(LEVEL9_SAVE_KEY, JSON.stringify({

    window.__unifiedPaused = false;
    window.addEventListener("message", (event) => {
      if (event.origin !== INTERNAL_ORIGIN || event.source !== window.parent ||
          !isMessageObject(event.data) ||
          !hasOnlyMessageKeys(event.data, ["type", "paused"]) ||
          event.data.type !== "unified-game-pause" || typeof event.data.paused !== "boolean") return;
      window.__unifiedPaused = event.data.paused;
      document.querySelectorAll("iframe").forEach((frame) => {
        try { frame.contentWindow?.postMessage(event.data, INTERNAL_ORIGIN); } catch {}
      });
      try {
        if (window.Module && window.__unifiedPaused && typeof Module.pauseMainLoop === "function") Module.pauseMainLoop();
        if (window.Module && !window.__unifiedPaused && typeof Module.resumeMainLoop === "function") Module.resumeMainLoop();
      } catch {}
    });

    function isMessageObject(data) {
      return data !== null && typeof data === "object" && !Array.isArray(data);
    }

    function hasOnlyMessageKeys(data, allowedKeys) {
      return Object.keys(data).every((key) => allowedKeys.includes(key));
    }

    function buildMap() {
      nodes.forEach((node, index) => {
        const el = document.createElement("button");
        el.className = "map-node locked";
        el.type = "button";
        el.textContent = index + 1;
        el.title = node.title;
        el.style.left = node.x + "%";
        el.style.top = node.y + "%";
        el.addEventListener("click", () => {
          if (index === state.current && state.current < 7) startMoment();
        });
        game.appendChild(el);
        node.el = el;
      });
      updateMap();
    }

    function updateMap() {
      saveLevel9Progress();
      nodes.forEach((node, index) => {
        node.el.classList.toggle("done", state.completed.has(index) || state.current === 7);
        node.el.classList.toggle("current", index === state.current);
        node.el.classList.toggle("locked", index > state.current);
      });
      const node = nodes[Math.min(state.current, 7)];
      jesusToken.style.left = node.x + "%";
      jesusToken.style.top = node.y + "%";
      if (state.current < 7) {
        mapMessage.textContent = nodes[state.current].title + ". Cada paso de resistencia nos acerca al plan de Dios.";
        startBtn.textContent = "Comenzar momento " + (state.current + 1);
        startBtn.style.display = "";
      } else {
        mapMessage.textContent = "Jesús llega al Gólgota con obediencia, amor y esperanza.";
        startBtn.textContent = "Nivel completado";
        startBtn.style.display = "none";
        showFinal();
      }

      if (location.protocol === "file:" || document.getElementById("tramo2PreloadWasm")) return;
      const resources = [
        ["tramo2PreloadWasm", "tramo2/index.wasm", "application/wasm"],
        ["tramo2PreloadPack", "tramo2/index.pck", "application/octet-stream"]
      ];
      resources.forEach(([id, href, type]) => {
        const link = document.createElement("link");
        link.id = id;
        link.rel = "preload";
        link.as = "fetch";
        link.href = href;
        link.type = type;
        link.crossOrigin = "anonymous";
        document.head.appendChild(link);
      });
    }

    function updateResistance() {
      saveLevel9Progress();
      state.resistance = Math.max(0, Math.min(100, state.resistance));
      resFill.style.width = state.resistance + "%";
      resText.textContent = state.resistance + "%";
      resFill.style.background = state.resistance <= 25
        ? "linear-gradient(#ff9b69, #d94b3f)"
        : "linear-gradient(#b9ff4f 0%, #71df20 48%, #42ad15 100%)";
    }

    function changeResistance(amount, label) {
      state.resistance = Math.max(0, Math.min(100, state.resistance + amount));
      updateResistance();
      if (label) showToast(label);
      if (state.resistance <= 0) {
        setTimeout(showRetry, 350);
        return false;
      }
      return true;
    }

    function startMoment() {
      if (state.current >= 7) return;
      cleanup();
      const moment = moments[state.current];

      challengeTitle.textContent = moment.title;
      challengeText.textContent = moment.text;

      const runners = [playPrecision, playBalanceGodot, playCircuitoEsperanza, playRunner, playSimon, playWords, playReactionGodot];

    function backToMap() {
      cleanup();

    function completeMoment(bonus = 5) {
      if (state.locked) return;
      state.locked = true;
      cleanup();
      state.completed.add(state.current);
      if (bonus > 0) {
        changeResistance(bonus, "Momento completado: +" + bonus + "% de resistencia");
      } else {
        showToast("Momento completado sin recompensa adicional");
      }
      setTimeout(() => {
        screen.classList.remove("active");
        startPanel.style.display = "";
        state.current += 1;
        updateMap();
      }, 1050);

    function playPrecision() {
      let round = 0;
      let pos = 0;
      let dir = 1;
      let raf = 0;
      const levels = [
        { speed: 1.05, start: 12, end: 28 },
        { speed: 1.30, start: 68, end: 84 },
        { speed: 1.55, start: 38, end: 54 },
        { speed: 1.85, start: 20, end: 34 },

          <button class="primary-btn action" type="button">Acción</button>
          <div class="round-info">La franja verde cambia de posición en cada nivel.</div>
        </div>
      `);
      const marker = miniInner.querySelector(".marker");
      const track = miniInner.querySelector(".precision-track");
      const levelNumber = miniInner.querySelector(".precision-level-number");
      const action = miniInner.querySelector(".action");
      function showLevel() {
        const level = levels[round];
        const yellowStart = Math.max(0, level.start - 8);
        const yellowEnd = Math.min(100, level.end + 8);
        track.style.background = `linear-gradient(90deg,
          #be4e3d 0% ${yellowStart}%,
          #f0ca5b ${yellowStart}% ${level.start}%,
          #74d64f ${level.start}% ${level.end}%,
          #f0ca5b ${level.end}% ${yellowEnd}%,
          #be4e3d ${yellowEnd}% 100%)`;
        track.setAttribute("aria-label", `Nivel ${round + 1}: zona verde entre ${level.start} y ${level.end} por ciento`);
        levelNumber.textContent = round + 1;
      }
      function frame() {
        if (window.__unifiedPaused) { raf = requestAnimationFrame(frame); return; }
        pos += dir * levels[round].speed;
        if (pos >= 100 || pos <= 0) {
          dir *= -1;
          pos = Math.max(0, Math.min(100, pos));
        }
        marker.style.left = pos + "%";
        raf = requestAnimationFrame(frame);
      }
      function press(e) {
        if (e && e.type === "keydown" && !isActionKey(e)) return;
        if (e) e.preventDefault();
        const level = levels[round];
        const hit = pos >= level.start && pos <= level.end;
        if (hit) changeResistance(0.5, "Acierto: +0.50%");
        else if (!changeResistance(-5, "Error leve: -5%")) return;
        round += 1;
        if (round >= levels.length) completeMoment(0);
        else showLevel();
      }
      showLevel();
      action.addEventListener("click", press);
      window.addEventListener("keydown", press);
      raf = requestAnimationFrame(frame);
      state.activeCleanup = () => {
        cancelAnimationFrame(raf);
        window.removeEventListener("keydown", press);
      };
    }

          const current = event.data.current;

      const pct = document.getElementById("rollPct");
      const keys = new Set();
      const hazards = [
        { type: "hole", x: 28, hit: false },

      ];
      hazards.forEach(h => {

        el.style.left = h.x + "%";
        stage.appendChild(el);
        h.el = el;
      });
      let progress = 0;
      let lane = 0;
      let roll = 0;
      let raf = 0;
      let last = performance.now();

      function setInput(code, on) {
        if (on) keys.add(code);
        else keys.delete(code);
      }
      function down(e) {
        if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
          keys.add(e.code);
          e.preventDefault();
        }
      }
      function up(e) { keys.delete(e.code); }
      function frame(now) {
        if (window.__unifiedPaused) { raf = requestAnimationFrame(frame); return; }
        const dt = Math.min(34, now - last) / 16;
        last = now;
        progress += .115 * dt;
        if (keys.has("ArrowLeft")) lane -= 1.8 * dt;

        lane = Math.max(-46, Math.min(46, lane));

      window.addEventListener("keyup", up);
      raf = requestAnimationFrame(frame);
      state.activeCleanup = () => {
        cancelAnimationFrame(raf);
        window.removeEventListener("keydown", down);
        window.removeEventListener("keyup", up);

    function playBalance() {
      miniInner.innerHTML = "";
      miniArea.insertAdjacentHTML("beforeend", `

          <button class="secondary-btn roll-left" type="button" style="position:absolute;left:18px;bottom:18px;z-index:4;">←</button>
          <button class="secondary-btn roll-right" type="button" style="position:absolute;right:18px;bottom:18px;z-index:4;">→</button>
        </div>
      `);
      const stage = document.getElementById("rollanceStage");
      const path = document.getElementById("rollancePath");
      const edge = document.getElementById("rollanceEdge");
      const ball = document.getElementById("rollanceBall");
      const pct = document.getElementById("rollPct");
      const keys = new Set();
      const frames = ["assets/jesus-bolita-1.jpeg", "assets/jesus-bolita-2.jpeg", "assets/jesus-bolita-3.jpeg"];
      let progress = 0;
      let x = 0;
      let velocity = 0;
      let roll = 0;
      let raf = 0;
      let last = performance.now();
      let mistakes = 0;
      let frameTick = 0;
      let ended = false;

      const pathPoints = [
        { p: 0, cx: 0, w: 250 },
        { p: 14, cx: -105, w: 190 },
        { p: 28, cx: 120, w: 160 },
        { p: 44, cx: -145, w: 145 },
        { p: 62, cx: 135, w: 135 },
        { p: 80, cx: -85, w: 120 },
        { p: 100, cx: 0, w: 110 }
      ];

      function setInput(code, on) {
        if (on) keys.add(code);
        else keys.delete(code);
      }
      function down(e) {
        if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
          keys.add(e.code);
          e.preventDefault();
        }
      }
      function up(e) { keys.delete(e.code); }
      function samplePath(p) {
        for (let i = 0; i < pathPoints.length - 1; i++) {
          const a = pathPoints[i];
          const b = pathPoints[i + 1];
          if (p >= a.p && p <= b.p) {
            const t = (p - a.p) / (b.p - a.p);
            const smooth = t * t * (3 - 2 * t);
            return {
              cx: a.cx + (b.cx - a.cx) * smooth,
              w: a.w + (b.w - a.w) * smooth
            };
          }
        }
        return pathPoints[pathPoints.length - 1];
      }
      function frame(now) {
        if (window.__unifiedPaused) { raf = requestAnimationFrame(frame); return; }
        if (ended) return;
        const dt = Math.min(34, now - last) / 16;
        last = now;
        progress += .082 * dt;
        const track = samplePath(progress);
        if (keys.has("ArrowLeft")) velocity -= .92 * dt;
        if (keys.has("ArrowRight")) velocity += .92 * dt;
        velocity *= .945;
        x += velocity * dt;
        x += (track.cx - x) * .004 * dt;
        roll += (velocity * 2.2 + 4.4) * dt;
        frameTick += dt;
        if (frameTick > 12) {
          frameTick = 0;
          ball.src = frames[Math.floor(progress / 4) % frames.length];
        }
        ball.style.transform = `translateX(${x}px) rotate(${roll}deg)`;
        path.style.backgroundPositionY = (progress * 28) + "px";
        path.style.clipPath = `polygon(${50 - track.w / 7}% 0, ${50 + track.w / 7}% 0, 94% 100%, 6% 100%)`;
        edge.style.clipPath = path.style.clipPath;
        pct.textContent = Math.min(100, Math.floor(progress)).toString();

        const distanceFromCenter = Math.abs(x - track.cx);
        if (distanceFromCenter > track.w * .72) {
          mistakes += 1;
          progress = Math.max(0, progress - 8);
          x = track.cx;
          velocity = 0;
          if (!changeResistance(-10, "Casi cae del camino: -10%")) return;
          if (mistakes >= 6) {
            ended = true;
            showRetry();
            return;
          }
        }
        if (progress >= 100) {
          completeMoment(5);
          return;
        }
        if (ended || modal.classList.contains("show")) return;
        raf = requestAnimationFrame(frame);
      }
      const leftBtn = stage.querySelector(".roll-left");
      const rightBtn = stage.querySelector(".roll-right");
      leftBtn.addEventListener("pointerdown", () => setInput("ArrowLeft", true));
      leftBtn.addEventListener("pointerup", () => setInput("ArrowLeft", false));
      leftBtn.addEventListener("pointerleave", () => setInput("ArrowLeft", false));
      rightBtn.addEventListener("pointerdown", () => setInput("ArrowRight", true));
      rightBtn.addEventListener("pointerup", () => setInput("ArrowRight", false));
      rightBtn.addEventListener("pointerleave", () => setInput("ArrowRight", false));
      window.addEventListener("keydown", down);
      window.addEventListener("keyup", up);
      raf = requestAnimationFrame(frame);
      state.activeCleanup = () => {
        ended = true;
        cancelAnimationFrame(raf);
        window.removeEventListener("keydown", down);
        window.removeEventListener("keyup", up);
        const rollance = document.getElementById("rollanceStage");
        if (rollance) rollance.remove();
      };
    }

    function playBreathing() {
      const levels = [
        { size: 3, path: [[0,1],[1,1],[1,2],[2,2]], start: [0,1], goal: [2,2] },
        { size: 4, path: [[0,0],[1,0],[1,1],[2,1],[2,2],[3,2]], start: [0,0], goal: [3,2] },
        { size: 4, path: [[0,3],[1,3],[1,2],[2,2],[2,1],[3,1],[3,0]], start: [0,3], goal: [3,0] },
        { size: 5, path: [[0,2],[1,2],[1,1],[2,1],[2,2],[3,2],[3,3],[4,3]], start: [0,2], goal: [4,3] }
      ];
      let level = 0;
      let tiles = [];
      setMini(`
        <div class="prompt">Energía: bucles antiestres - nivel 1 de 4</div>
        <div class="energy-board" id="energyBoard"></div>
        <div class="round-info" id="energyInfo">Toca las piezas para girarlas y llevar la energía del rayo al corazón.</div>
      `);
      const board = document.getElementById("energyBoard");
      const prompt = miniInner.querySelector(".prompt");
      const info = document.getElementById("energyInfo");

      function keyOf(r, c) { return r + "," + c; }
      function dirsFor(tile) {
        if (tile.kind === "empty") return [];
        const base = tile.kind === "straight" ? ["N", "S"] : ["N", "E"];
        return base.map(d => rotateDir(d, tile.rot));
      }
      function rotateDir(dir, rot) {
        const dirs = ["N", "E", "S", "W"];
        return dirs[(dirs.indexOf(dir) + rot) % 4];
      }
      function opposite(dir) {
        return { N: "S", S: "N", E: "W", W: "E" }[dir];
      }
      function step(r, c, dir) {
        if (dir === "N") return [r - 1, c];
        if (dir === "S") return [r + 1, c];
        if (dir === "E") return [r, c + 1];
        return [r, c - 1];
      }
      function buildTiles() {
        const cfg = levels[level];
        const pathSet = new Set(cfg.path.map(([r, c]) => keyOf(r, c)));
        tiles = [];
        for (let r = 0; r < cfg.size; r++) {
          for (let c = 0; c < cfg.size; c++) {
            const onPath = pathSet.has(keyOf(r, c));
            let kind = "empty";
            let targetRot = 0;
            if (onPath) {
              const index = cfg.path.findIndex(([pr, pc]) => pr === r && pc === c);
              const prev = cfg.path[index - 1];
              const next = cfg.path[index + 1];
              const dirs = [];
              [prev, next].forEach(p => {
                if (!p) return;
                if (p[0] < r) dirs.push("N");
                if (p[0] > r) dirs.push("S");
                if (p[1] < c) dirs.push("W");
                if (p[1] > c) dirs.push("E");
              });
              kind = dirs.includes("N") && dirs.includes("S") || dirs.includes("E") && dirs.includes("W") ? "straight" : "elbow";
              for (let rot = 0; rot < 4; rot++) {
                const rotated = kind === "straight" ? ["N", "S"].map(d => rotateDir(d, rot)) : ["N", "E"].map(d => rotateDir(d, rot));
                if (dirs.every(d => rotated.includes(d))) targetRot = rot;
              }
            }
            tiles.push({ r, c, kind, rot: onPath ? (targetRot + 1 + ((r + c + level) % 3)) % 4 : 0, targetRot, powered: false, onPath });
          }
        }
      }
      function draw() {
        const cfg = levels[level];
        board.style.gridTemplateColumns = `repeat(${cfg.size}, 1fr)`;
        board.innerHTML = "";
        tiles.forEach(tile => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "energy-tile" + (tile.powered ? " powered" : "") + (keyOf(tile.r, tile.c) === keyOf(...cfg.goal) ? " heart" : "");
          btn.style.setProperty("--rot", (tile.rot * 90) + "deg");
          btn.style.setProperty("--elbow", tile.kind === "elbow" ? "block" : "none");
          btn.textContent = keyOf(tile.r, tile.c) === keyOf(...cfg.start) ? "⚡" : (keyOf(tile.r, tile.c) === keyOf(...cfg.goal) ? "♥" : "");
          btn.disabled = tile.kind === "empty";
          btn.addEventListener("click", () => {
            if (tile.kind === "empty") return;
            tile.rot = (tile.rot + 1) % 4;
            updatePower();
          });
          board.appendChild(btn);
        });
      }
      function updatePower() {
        tiles.forEach(t => t.powered = false);
        const cfg = levels[level];
        const byKey = new Map(tiles.map(t => [keyOf(t.r, t.c), t]));
        const queue = [cfg.start];
        const seen = new Set();
        while (queue.length) {
          const [r, c] = queue.shift();
          const k = keyOf(r, c);
          if (seen.has(k)) continue;
          seen.add(k);
          const tile = byKey.get(k);
          if (!tile || tile.kind === "empty") continue;
          tile.powered = true;
          dirsFor(tile).forEach(dir => {
            const [nr, nc] = step(r, c, dir);
            const next = byKey.get(keyOf(nr, nc));
            if (next && dirsFor(next).includes(opposite(dir))) queue.push([nr, nc]);
          });
        }
        draw();
        const goal = byKey.get(keyOf(...cfg.goal));
        if (goal && goal.powered) {
          changeResistance(5, "Energía conectada: +5%");
          level += 1;
          if (level >= levels.length) completeMoment(5);
          else {
            prompt.textContent = "Energía: bucles antiestres - nivel " + (level + 1) + " de 4";
            info.textContent = "Muy bien. Ahora conecta el siguiente circuito.";
            setTimeout(() => {
              buildTiles();
              updatePower();
            }, 650);
          }
        }
      }
      buildTiles();
      updatePower();
      state.activeCleanup = () => {};
    }

    function playRunner() {
      const totalObstacles = 80;
      miniInner.innerHTML = "";
      miniArea.insertAdjacentHTML("beforeend", `
        <div class="runner" id="runnerStage">
          <div class="runner-road"></div>
          <img class="runner-jesus" id="runnerJesus" src="assets/jesus-walk-1.png" alt="">
          <div class="prompt" style="position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:3;">Camino recorrido: <span id="runCount">0</span> / ${totalObstacles}</div>
        </div>
      `);
      const stage = document.getElementById("runnerStage");
      const hero = document.getElementById("runnerJesus");
      const countEl = document.getElementById("runCount");
      const frames = ["assets/jesus-walk-1.png", "assets/jesus-walk-2.png", "assets/jesus-walk-3.png", "assets/jesus-walk-4.png", "assets/jesus-walk-5.png"];
      let jumping = false;
      let crouching = false;
      let count = 0;
      let speed = 4.15;
      let spawnTimer = 650;
      let raf = 0;
      let frameTick = 0;
      let jumpY = 0;
      let jumpVelocity = 0;
      let jumpHeld = false;
      let lastFrameTime = performance.now();
      let obstacleBag = [];
      let lastObstacleVisual = "";
      const obstacles = [];

      function nextObstacleVisual() {
        if (obstacleBag.length === 0) {
          obstacleBag = ["rock", "torch", "wood"];
          for (let index = obstacleBag.length - 1; index > 0; index -= 1) {
            const swapIndex = Math.floor(Math.random() * (index + 1));
            [obstacleBag[index], obstacleBag[swapIndex]] = [obstacleBag[swapIndex], obstacleBag[index]];
          }
          if (obstacleBag[0] === lastObstacleVisual) {
            [obstacleBag[0], obstacleBag[1]] = [obstacleBag[1], obstacleBag[0]];
          }
        }
        lastObstacleVisual = obstacleBag.shift();
        return lastObstacleVisual;
      }

      function spawn() {
        const visual = nextObstacleVisual();
        const high = visual === "wood";
        const torch = visual === "torch";
        const ob = document.createElement("div");
        ob.className = "obstacle " + (high ? "high wood" : (torch ? "torch" : "rock"));
        ob.textContent = high ? "Madero" : (torch ? "" : "Piedra");
        ob.dataset.type = high ? "high" : "low";
        stage.appendChild(ob);
        obstacles.push({ el: ob, x: stage.clientWidth + 120, judged: false, type: ob.dataset.type });
      }
      function jump() {
        if (jumping || crouching) return;
        jumping = true;
        jumpY = 12;
        jumpVelocity = 820;
        hero.style.bottom = `calc(24% + ${jumpY}px)`;
      }
      function crouch(on) {
        crouching = on;
        hero.classList.toggle("crouch", on);
      }
      function key(e) {
        if (e.code === "ArrowUp" || e.code === "Space") {
          e.preventDefault();
          if (!e.repeat && (!jumpHeld || !e.isTrusted)) jump();
          if (e.isTrusted) jumpHeld = true;
        }
        if (e.code === "ArrowDown") {
          e.preventDefault();
          crouch(true);
        }
      }
      function keyup(e) {
        if (e.code === "ArrowUp" || e.code === "Space") jumpHeld = false;
        if (e.code === "ArrowDown") crouch(false);
      }
      function touchJump(e) {
        if (e && e.isPrimary === false) return;
        if (e) e.preventDefault();
        jump();
      }
      function frame(now) {
        if (window.__unifiedPaused) { raf = requestAnimationFrame(frame); return; }
        const delta = Math.min(.034, Math.max(.001, (now - lastFrameTime) / 1000));
        const frameScale = delta * 60;
        lastFrameTime = now;
        spawnTimer -= delta * 1000;
        frameTick += 1;
        if (jumping) {
          jumpVelocity -= (jumpVelocity > 0 ? 1900 : 4400) * delta;
          jumpY += jumpVelocity * delta;
          if (jumpY <= 0) {
            jumpY = 0;
            jumpVelocity = 0;
            jumping = false;
          }
          hero.style.bottom = `calc(24% + ${jumpY.toFixed(1)}px)`;
        }
        if (!jumping && !crouching && frameTick % 8 === 0) {
          hero.src = frames[Math.floor(frameTick / 8) % frames.length];
        }
        if (spawnTimer <= 0 && count < totalObstacles) {
          spawn();
          const baseGap = Math.max(900, 1650 - count * 20);
          const rhythms = [.82, 1.0, 1.22, 1.42];
          const rhythm = rhythms[Math.floor(Math.random() * rhythms.length)];
          spawnTimer = Math.max(820, baseGap * rhythm + Math.random() * 120);
        }
        obstacles.forEach((ob) => {
          ob.x -= speed * frameScale;
          ob.el.style.right = (stage.clientWidth - ob.x) + "px";
          const heroX = stage.clientWidth * .1 + 56;
          if (!ob.judged && ob.x < heroX + 32) {
            ob.judged = true;
            const ok = ob.type === "low" ? jumpY > 48 : crouching;
            if (ok) showToast("Reacción correcta");
            else changeResistance(-5, "Error leve: -5%");
            count += 1;
            countEl.textContent = count;
            const finalStretch = count >= 60;
            speed = Math.min(finalStretch ? 10.2 : 7.6, speed + (finalStretch ? .16 : .11));
          }
          if (ob.x < -140) {
            ob.el.remove();
          }
        });
        for (let i = obstacles.length - 1; i >= 0; i--) {
          if (!obstacles[i].el.isConnected) obstacles.splice(i, 1);
        }
        if (count >= totalObstacles && obstacles.length === 0) {
          completeMoment(3);
          return;
        }
        raf = requestAnimationFrame(frame);
      }
      window.addEventListener("keydown", key);
      window.addEventListener("keyup", keyup);
      stage.addEventListener("pointerdown", touchJump, { passive: false });
      bottomActionBtn.addEventListener("pointerdown", touchJump, { passive: false });
      raf = requestAnimationFrame(frame);
      state.activeCleanup = () => {
        cancelAnimationFrame(raf);
        window.removeEventListener("keydown", key);
        window.removeEventListener("keyup", keyup);
        stage.removeEventListener("pointerdown", touchJump);
        bottomActionBtn.removeEventListener("pointerdown", touchJump);
        const runner = document.getElementById("runnerStage");
        if (runner) runner.remove();
      };
    }

    function playSimon() {
      const images = [
        "assets/historias biblicas.jpg",
        "assets/simon-y-cristo.png",
        "assets/simon-2.png",
        "assets/simon-orando.png",
        "assets/las-aventuras-de-jesus.jpeg",
        "assets/juntos-biblia.jpg"
      ];
      const layouts = [
        { cols: 2, rows: 2 },
        { cols: 3, rows: 2 },
        { cols: 3, rows: 3 },
        { cols: 4, rows: 3 },
        { cols: 5, rows: 3 },
        { cols: 4, rows: 4 }
      ];
      const moveLimits = [6, 7, 8, 9, 10, 12];
      let level = 0;
      let order = [];
      let selected = null;
      let moves = 0;
      let dragState = null;
      let puzzleLocked = false;
      setMini(`
        <div class="prompt">Rompecabezas del camino - imagen 1 de 6</div>
        <div class="puzzle-wrap">
          <div class="puzzle-board" id="puzzleBoard"></div>
          <div class="puzzle-side">
            <img class="puzzle-preview" id="puzzlePreview" src="assets/historias biblicas.jpg" alt="Imagen guía del rompecabezas">
            <div class="round-info" id="puzzleInfo">Arrastra una pieza sobre otra para intercambiarlas.</div>
          </div>
        </div>
      `);
      const board = document.getElementById("puzzleBoard");
      const preview = document.getElementById("puzzlePreview");
      const prompt = miniInner.querySelector(".prompt");
      const info = document.getElementById("puzzleInfo");

      function currentMoveLimit() {
        return moveLimits[level];
      }

      function shuffle(pieceCount) {
        order = Array.from({ length: pieceCount }, (_, index) => index);
        const swapCount = Math.min(currentMoveLimit(), pieceCount - 1);
        const allPieces = [...order];
        allPieces.sort(() => Math.random() - .5);
        const cycle = allPieces.slice(0, swapCount + 1);
        cycle.sort(() => Math.random() - .5);
        for (let index = 0; index < cycle.length - 1; index += 1) {
          const first = cycle[index];
          const second = cycle[index + 1];
          [order[first], order[second]] = [order[second], order[first]];
        }
      }

      function isPieceCorrect(piece, slot) {
        return piece === slot;
      }

      function isPuzzleSolved() {
        return order.every((piece, slot) => isPieceCorrect(piece, slot));
      }

      function pieceStyle(piece) {
        const layout = layouts[level];
        const column = piece % layout.cols;
        const row = Math.floor(piece / layout.cols);
        const x = layout.cols === 1 ? 0 : column / (layout.cols - 1) * 100;
        const y = layout.rows === 1 ? 0 : row / (layout.rows - 1) * 100;
        return {
          size: `${layout.cols * 100}% ${layout.rows * 100}%`,
          position: `${x}% ${y}%`
        };
      }

      function applyPieceImage(tile, piece) {
        const style = pieceStyle(piece);
        tile.style.backgroundImage = `url("${images[level]}")`;
        tile.style.backgroundSize = style.size;
        tile.style.backgroundPosition = style.position;
      }

      function drawPuzzle() {
        cleanupDrag();
        selected = null;
        moves = 0;
        puzzleLocked = false;
        const layout = layouts[level];
        const pieceCount = layout.cols * layout.rows;
        shuffle(pieceCount);
        board.innerHTML = "";
        board.style.setProperty("--puzzle-cols", layout.cols);
        board.style.setProperty("--puzzle-rows", layout.rows);
        preview.src = images[level];
        prompt.textContent = "Rompecabezas del camino - imagen " + (level + 1) + " de " + images.length;
        info.textContent = `Arrastra las ${pieceCount} piezas. Oportunidades: ${currentMoveLimit()} movimientos.`;
        order.forEach((piece, slot) => {
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = "puzzle-tile";
          tile.dataset.slot = slot;
          tile.setAttribute("aria-label", `Pieza ${slot + 1} de ${pieceCount}. Arrastra para intercambiar.`);
          applyPieceImage(tile, piece);
          tile.classList.toggle("correct", isPieceCorrect(piece, slot));
          tile.addEventListener("pointerdown", event => beginDrag(event, slot, tile));
          tile.addEventListener("pointermove", moveDrag);
          tile.addEventListener("pointerup", endDrag);
          tile.addEventListener("pointercancel", cancelDrag);
          tile.addEventListener("keydown", event => {
            if (event.code !== "Enter" && event.code !== "Space") return;
            event.preventDefault();
            chooseTile(slot);
          });
          board.appendChild(tile);
        });
      }

      function beginDrag(event, slot, tile) {
        if (puzzleLocked || (event.pointerType === "mouse" && event.button !== 0)) return;
        event.preventDefault();
        cleanupDrag();
        const rect = tile.getBoundingClientRect();
        const ghost = tile.cloneNode(false);
        ghost.className = "puzzle-tile puzzle-drag-ghost";
        ghost.removeAttribute("data-slot");
        ghost.style.width = rect.width + "px";
        ghost.style.height = rect.height + "px";
        document.body.appendChild(ghost);
        tile.classList.add("dragging");
        tile.setPointerCapture?.(event.pointerId);
        dragState = { pointerId: event.pointerId, from: slot, tile, ghost, target: null };
        positionGhost(event.clientX, event.clientY);
      }

      function positionGhost(x, y) {
        if (!dragState) return;
        dragState.ghost.style.left = x + "px";
        dragState.ghost.style.top = y + "px";
      }

      function findDropTarget(x, y) {
        const element = document.elementFromPoint(x, y);
        return element?.closest?.(".puzzle-tile:not(.puzzle-drag-ghost)") || null;
      }

      function moveDrag(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        event.preventDefault();
        positionGhost(event.clientX, event.clientY);
        const target = findDropTarget(event.clientX, event.clientY);
        if (dragState.target && dragState.target !== target) dragState.target.classList.remove("drag-target");
        dragState.target = target;
        if (target && Number(target.dataset.slot) !== dragState.from) target.classList.add("drag-target");
      }

      function endDrag(event) {
        if (!dragState || event.pointerId !== dragState.pointerId) return;
        event.preventDefault();
        const from = dragState.from;
        const target = findDropTarget(event.clientX, event.clientY) || dragState.target;
        const to = target ? Number(target.dataset.slot) : from;
        cleanupDrag();
        if (Number.isInteger(to) && to !== from) swapPieces(from, to);
      }

      function cancelDrag() {
        cleanupDrag();
      }

      function cleanupDrag() {
        if (!dragState) return;
        dragState.tile?.classList.remove("dragging");
        dragState.target?.classList.remove("drag-target");
        dragState.ghost?.remove();
        dragState = null;
      }

      function swapPieces(from, to) {
        if (puzzleLocked) return;
        [order[from], order[to]] = [order[to], order[from]];
        moves += 1;
        selected = null;
        drawTilesOnly();
        checkPuzzle();
      }

      function chooseTile(slot) {
        const tiles = [...board.querySelectorAll(".puzzle-tile")];
        if (selected === null) {
          selected = slot;
          tiles[slot].style.outline = "5px solid #ffd76a";
          return;
        }
        tiles[selected].style.outline = "";
        if (selected !== slot) {
          swapPieces(selected, slot);
        }
        selected = null;
      }

      function checkPuzzle() {
        if (isPuzzleSolved()) {
          puzzleLocked = true;
          showToast("Imagen completada sin recompensa adicional");
          level += 1;
          if (level >= images.length) completeMoment(0);
          else setTimeout(drawPuzzle, 700);
          return;
        }
        const moveLimit = currentMoveLimit();
        if (moves >= moveLimit) {
          changeResistance(-5, `Movimiento fuera del límite: -5%`);
          info.textContent = `Agotaste las ${moveLimit} oportunidades. Cada movimiento adicional resta 5%.`;
        }
      }

      function drawTilesOnly() {
        [...board.querySelectorAll(".puzzle-tile")].forEach((tile, slot) => {
          const piece = order[slot];
          tile.style.outline = "";
          applyPieceImage(tile, piece);
          tile.classList.toggle("correct", isPieceCorrect(piece, slot));
        });
        info.textContent = `Movimientos: ${moves} / ${currentMoveLimit()}`;
      }

      drawPuzzle();
      state.activeCleanup = cleanupDrag;
    }

        if (!running) return;
        const target = notes
          .filter(note => note.lane === lane && !note.hit && note.y > lanes[lane].clientHeight - 130 && note.y < lanes[lane].clientHeight - 42)
          .sort((first, second) => second.y - first.y)[0];

      function frame(now) {
        if (window.__unifiedPaused) { raf = requestAnimationFrame(frame); return; }
        const delta = Math.min(.04, Math.max(.001, (now - lastFrameTime) / 1000));
        lastFrameTime = now;
        spawnTimer -= delta * 1000;
        if (spawnTimer <= 0 && hits < goal) {
          spawn();

      function atomById(id) {
        return atoms.find(atom => atom.id === id);

      function activeAtom(id) {
        const atom = atomById(id);
        return atom && !atom.destroyed ? atom : null;
      }

      function activeNeighbors(id, excluded = new Set()) {
        const result = [];
        bonds.forEach(bond => {
          if (bond.a !== id && bond.b !== id) return;
          const otherId = bond.a === id ? bond.b : bond.a;
          const other = activeAtom(otherId);
          if (other && !excluded.has(otherId)) result.push(otherId);
        });
        return result;
      }

      function reactionFor(id) {
        const direct = new Set([id, ...activeNeighbors(id)]);
        const remaining = atoms.filter(atom => !atom.destroyed && !direct.has(atom.id));
        const remainingIds = new Set(remaining.map(atom => atom.id));
        const visited = new Set();
        const removal = new Set(direct);

        remaining.forEach(atom => {
          if (visited.has(atom.id)) return;
          const component = [];
          const queue = [atom.id];
          visited.add(atom.id);
          while (queue.length) {
            const current = queue.shift();
            component.push(current);
            activeNeighbors(current, direct).forEach(next => {
              if (remainingIds.has(next) && !visited.has(next)) {
                visited.add(next);
                queue.push(next);
              }
            });
          }
          const containsEssential = component.some(componentId => atomById(componentId).type === "good");
          if (!containsEssential) component.forEach(componentId => removal.add(componentId));
        });
        return removal;
      }

      function drawNetwork() {
        svg.innerHTML = "";
        stage.querySelectorAll(".mol-atom").forEach(element => element.remove());
        const dense = atoms.filter(atom => !atom.destroyed).length >= 15;
        stage.classList.toggle("dense-network", dense);

        bonds.forEach(bond => {
          const first = activeAtom(bond.a);
          const second = activeAtom(bond.b);
          if (!first || !second) return;
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", first.x);
          line.setAttribute("y1", first.y);
          line.setAttribute("x2", second.x);
          line.setAttribute("y2", second.y);
          line.classList.add("mol-bond", "normal");
          if (previewRemoval.has(first.id) || previewRemoval.has(second.id)) line.classList.add("reaction-preview");
          svg.appendChild(line);
        });

        atoms.forEach(atom => {
          if (atom.destroyed) return;
          const button = document.createElement("button");
          button.type = "button";
          button.className = `mol-atom ${atom.type}`;
          button.style.left = atom.x + "%";
          button.style.top = atom.y + "%";
          button.textContent = atom.label;
          button.title = atom.word;
          button.setAttribute("aria-label", `${atom.word}. ${atom.type === "good" ? "Esencial" : atom.type === "bad" ? "Corrupción" : "Neutral"}`);
          if (previewRemoval.has(atom.id)) button.classList.add("reaction-preview");
          if (selectedId === atom.id) button.classList.add("reaction-origin");
          button.addEventListener("click", () => chooseAtom(atom.id));
          stage.appendChild(button);
        });
      }
